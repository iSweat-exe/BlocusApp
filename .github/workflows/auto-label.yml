name: Auto label

# pull_request_target: runs with a write token even for Dependabot and forks. Safe here because the workflow never
# executes code from the PR: it checks out the base branch and only reads the title, the body and the changed files.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  issues:
    types: [opened, edited]

permissions:
  contents: read

concurrency:
  group: auto-label-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  pull-request:
    name: Label pull request
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      # Scripts and labeler.yml come from the base branch (main), never from the PR.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts
            .github/labeler.yml
      - uses: actions/labeler@v5
        with:
          sync-labels: true
      - name: Labels from the title, size and checklist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash .github/scripts/auto-label-pr.sh

  issue:
    name: Label issue
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Labels from the issue form
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          EVENT_ACTION: ${{ github.event.action }}
        run: bash .github/scripts/auto-label-issue.sh
