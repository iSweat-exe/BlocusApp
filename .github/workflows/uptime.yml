name: Uptime

# Watches the production site from outside: every 10 minutes it calls /api/health. When the site is down it opens an
# issue "Application indisponible" (GitHub e-mails the people who watch the repository) and marks the run as failed;
# when the site is back it comments and closes that issue. Free: public repository minutes, no third party.
#
# Needs the repository variable PRODUCTION_URL (Settings > Secrets and variables > Actions > Variables), for example
# https://blocus.example.com. Without it the job does nothing and says so.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

# One check at a time, and a slow one never piles up behind the next.
concurrency:
  group: uptime
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  health:
    name: Health check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      INCIDENT_TITLE: "Application indisponible"
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Check /api/health
        id: check
        run: |
          if [[ -z "$PRODUCTION_URL" ]]; then
            echo "::notice::PRODUCTION_URL is not set: nothing to check."
            echo "down=false" >> "$GITHUB_OUTPUT"
            echo "reason=not configured" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bash .github/scripts/check-health.sh "$PRODUCTION_URL"

      - name: Open or close the incident
        env:
          DOWN: ${{ steps.check.outputs.down }}
          REASON: ${{ steps.check.outputs.reason }}
        run: |
          open_number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$INCIDENT_TITLE\"" --json number,title --jq "map(select(.title == \"$INCIDENT_TITLE\")) | .[0].number // empty")"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          now="$(date -u +'%Y-%m-%d %H:%M UTC')"

          if [[ "$DOWN" == "true" ]]; then
            if [[ -z "$open_number" ]]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$INCIDENT_TITLE" --body "$(printf 'Le contrôle de santé de la production ne répond plus (%s).\n\n- Première détection : %s\n- Contrôle : %s\n\nVoir `docs/runbook.md` (section « Surveillance ») pour la marche à suivre. Cette issue se ferme toute seule au retour du service.' "$REASON" "$now" "$run_url")"
            else
              echo "Incident #$open_number already open."
            fi
          elif [[ -n "$open_number" ]]; then
            gh issue comment "$open_number" --repo "$GITHUB_REPOSITORY" --body "Service rétabli le $now ($run_url)."
            gh issue close "$open_number" --repo "$GITHUB_REPOSITORY"
          fi

      # A red run is what e-mails the watchers, and shows the outage in the Actions tab.
      - name: Fail the run when the site is down
        if: steps.check.outputs.down == 'true'
        env:
          REASON: ${{ steps.check.outputs.reason }}
        run: |
          echo "::error::Production is down ($REASON)"
          exit 1
