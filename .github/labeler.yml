"area: settings":
  - changed-files:
      - any-glob-to-any-file:
          - src/features/settings/**
          - src/app/**/settings/**

"area: health":
  - changed-files:
      - any-glob-to-any-file:
          - src/features/health/**
          - src/app/api/health/**
