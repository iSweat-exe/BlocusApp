# Path-based labels, applied to every PR by .github/workflows/auto-label.yml (actions/labeler).
# Only labels listed here are managed (added and removed) by the labeler: all others are left alone.
# Label names, colours and descriptions live in .github/labels.yml.

"area: auth":
  - changed-files:
      - any-glob-to-any-file:
          - src/features/auth/**
          - src/app/*auth*/**
          - src/lib/supabase/**
          - src/proxy.ts
          - src/proxy.test.ts

"area: permissions":
  - changed-files:
      - any-glob-to-any-file:
          - src/lib/data/permissions*
          - src/lib/data/sanctions*
          - src/server/require-permission*
          - src/features/admin/permission-*
          - src/features/admin/hierarchy*
          - src/features/admin/sanction*
          - src/features/admin/role-*
          - src/features/admin/user-permissions.tsx
          - docs/permissions.md

"area: database":
  - changed-files:
      - any-glob-to-any-file:
          - supabase/**
          - src/lib/database.types.ts
          - docs/database.md

"area: admin":
  - changed-files:
      - any-glob-to-any-file:
          - src/features/admin/**
          - src/app/**/admin/**
          - src/lib/data/audit*

