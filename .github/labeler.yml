"area: pwa":
  - changed-files:
      - any-glob-to-any-file:
          - public/sw.js
          - public/icons/**
          - src/app/manifest.ts
          - src/app/icon.png
          - src/components/service-worker-register*

"area: infra":
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
          - .husky/**
          - vercel.json
          - commitlint.config.mjs
          - release-please-config.json
          - .release-please-manifest.json
          - eslint.config.mjs
          - vitest.config.ts
          - playwright.config.ts
          - load/**

# Only for PRs that change nothing but documentation (a feature that updates its docs is not an area: docs PR).
"area: docs":
  - changed-files:
      - any-glob-to-all-files:
          - docs/**
          - .dev/**
          - CLAUDE.md
          - AGENTS.md
          - README.md

# --- flags ---------------------------------------------------------------------------------------------------------

migration:
  - changed-files:
      - any-glob-to-any-file: supabase/migrations/**

security:
  - changed-files:
      - any-glob-to-any-file:
          - src/server/**
          - src/lib/supabase/**
          - src/proxy.ts
          - docs/security.md

free-tier:
  - changed-files:
      - any-glob-to-any-file:
          - vercel.json
          - next.config.ts
          - src/app/api/keep-alive/**
          - src/lib/data/cache-tags.ts
          - .dev/constraints.md
          - docs/performance.md
          - docs/load-testing.md
          - load/**
