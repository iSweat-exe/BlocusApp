name: LLM task
description: A well-scoped task meant to be executed by an LLM agent
labels: ["type: llm-task"]
body:
  - type: input
    id: checklist
    attributes:
      label: Checklist ID
      description: Example `A-015` or `O-030`.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Becomes the `area:` label.
      options:
        - auth
        - permissions
        - database
        - admin
        - announcements
        - calendar
        - map
        - posts
        - profile
        - settings
        - health
        - ui
        - pwa
        - accessibility
        - infra
        - docs
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Becomes the `priority:` label.
      options:
        - high - blocks the current checklist step
        - medium - planned for the current version
        - low - nice to have
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One precise outcome. Mention the files/folders the agent may touch.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Rules from CLAUDE.md that matter here, things the agent must NOT do.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Tests to pass, docs to update, behaviour to verify.
    validations:
      required: true
